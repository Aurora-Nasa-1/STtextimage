<div class="custom-vision-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Custom Vision Injector 设置</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="cvi_api_url">API 端点 (Endpoint URL):</label>
            <input id="cvi_api_url" class="text_pole" type="text" value="{{apiUrl}}" placeholder="例如: http://127.0.0.1:11434/v1/chat/completions" />

            <label for="cvi_api_key">API Key (如果有):</label>
            <input id="cvi_api_key" class="text_pole" type="password" value="{{apiKey}}" placeholder="sk-..." />

            <label for="cvi_model_id">模型名称 (Model ID):</label>
            <input id="cvi_model_id" class="text_pole" type="text" value="{{modelId}}" placeholder="例如: llava, qwen-vl" />

            <label for="cvi_prompt">给视觉模型的提示词 (Prompt):</label>
            <textarea id="cvi_prompt" class="text_pole" rows="2">{{prompt}}</textarea>

            <label for="cvi_template">注入格式模板 (用 &#123;&#123;caption&#125;&#125; 代表生成的描述):</label>
            <textarea id="cvi_template" class="text_pole" rows="2">{{template}}</textarea>
        </div>
    </div>
</div>
